name: Build

# Checks that the project still builds, on every push to main and every pull request.
# (Installers are made by release.yml, which only runs for a version tag.)
#
# macOS is the platform the project is developed and tested on. The Windows and Linux
# jobs are marked continue-on-error because no build there has been verified yet; a
# failure shows up as a warning, not a red cross. Once one of them passes, delete its
# continue-on-error line so that platform is held to the same standard.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15            # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: ./build.sh --yes
      - name: The program starts
        run: ./nova64/build/nova64 --help
      - name: RSP recompiler matches the interpreter
        run: ./nova64/build/nova64 --rsp-selftest --programs 4000

  windows:
    runs-on: windows-latest
    continue-on-error: true      # unverified, see the note at the top
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        shell: pwsh
        run: |
          cmake -S nova64 -B nova64/build -G "Visual Studio 17 2022" -A x64
          cmake --build nova64/build --config RelWithDebInfo --parallel
      - name: RSP recompiler matches the interpreter
        shell: pwsh
        run: nova64/build/RelWithDebInfo/nova64.exe --rsp-selftest --programs 4000

  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true      # unverified, see the note at the top
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev libgl1-mesa-dev
      - name: Build
        run: ./build.sh --yes
      - name: RSP recompiler matches the interpreter
        run: ./nova64/build/nova64 --rsp-selftest --programs 4000
